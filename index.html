    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Agentics",
      "legalName": "Agentics SRL",
      "url": "https://agentics.eu.com",
      "logo": "https://agentics.eu.com/web-app-manifest-512x512.png",
      "description": "Agentics sviluppa software personalizzato potenziato con AI per automatizzare processi aziendali: soluzioni custom e automazioni operative.",

        "@type": "PostalAddress",
        "addressCountry": "IT"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Sales",
        "availableLanguage": ["Italian", "English"]
      },
      "sameAs": [
        "https://agentics.eu.com"
      ],
      "foundingDate": "2025",
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "value": "5-10"
      },
      "areaServed": "IT",
      "serviceType": [
        "Automazione AI",
        "Software personalizzato potenziato con AI",
        "Machine Learning",
        "Consulenza AI",
        "Soluzioni AI su misura"
      ]
    }
    </script>

    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Agentics",
      "url": "https://agentics.eu.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://agentics.eu.com/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">

      },
      "areaServed": "IT",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servizi AI Agentics",
        "itemListElement": [
          {
            "@type": "Offer",

              "@type": "Service",

            }
          },
          {
            "@type": "Offer",

              "@type": "Service",

            }
          }
        ]
      }
    }
